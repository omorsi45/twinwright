# Faults for the flagship company incident.
#
# Two faults, chosen because the agent can be expected to survive both and the
# run is only evidence if it is survivable:
#
#   - A temporary billing outage across the charge-read endpoints. The correct
#     response is a plain retry: nothing was committed, so repeating the read is
#     safe. The rule names both read operations because a partial service outage
#     is a service degrading, not a single endpoint failing; the runtime rejects
#     a one-operation outage for that reason.
#   - A lost response on the refund write. This one is not safe to retry blind,
#     because the refund may already have committed. The agent has to read the
#     charge back and decide from what it finds.
#
# On stale reads, and why one is not here.
#
# Reconciliation runs THROUGH getCharge, so on the face of it a stale snapshot
# there is the obvious next fault to try: the read-back would report the refund
# as missing and the agent would issue a second one.
#
# It cannot currently reach this trajectory, and the reason is worth recording so
# nobody adds the rule expecting it to fire. The runtime only selects a
# stale_read once it has a snapshot of an identical earlier call to serve, and it
# requires after_calls of at least one, so the rule needs two reads of the same
# charge. This trajectory reads the charge exactly once, during reconciliation.
# Adding the rule here is accepted by validation and then silently never injects,
# which was confirmed by running it: the ledger recorded the outage and the lost
# response and nothing else.
#
# The design intent still stands for the day the trajectory gains an earlier
# charge read: a fault that poisons the evidence recovery depends on belongs in a
# counterfactual intervention, where the divergence is the finding, not in the run
# that demonstrates safe recovery.
version: 1
rules:
  - id: billing-temporary-outage
    type: partial_service_outage
    operations: [listCharges, getCharge]
    times: 1
  - id: refund-response-lost
    type: timeout_after_commit
    operations: [createRefund]
    times: 1
