# Faults for the flagship company incident.
#
# Two faults, chosen because the agent can be expected to survive both and the
# run is only evidence if it is survivable:
#
#   - A temporary billing outage across the charge-read endpoints. The correct
#     response is a plain retry: nothing was committed, so repeating the read is
#     safe. The rule names both read operations because a partial service outage
#     is a service degrading, not a single endpoint failing; the runtime rejects
#     a one-operation outage for that reason.
#   - A lost response on the refund write. This one is not safe to retry blind,
#     because the refund may already have committed. The agent has to read the
#     charge back and decide from what it finds.
#
# On stale reads, and why one is not here.
#
# Reconciliation runs THROUGH getCharge, so on the face of it a stale snapshot
# there is the obvious next fault to try: the read-back would report the refund
# as missing and the agent would issue a second one.
#
# That used to be unreachable, and the reason is worth keeping because it is a
# general trap. The runtime only selects a stale_read once it holds a snapshot of
# an identical earlier call to serve, and it requires after_calls of at least
# one, so the rule needs two reads of the same charge. When the trajectory read
# the charge exactly once, during reconciliation, adding the rule here was
# accepted by validation and then silently injected nothing. A chaos rule that
# validates is not a chaos rule that fires.
#
# The agent now reads the charge before refunding it, so the fault is reachable
# and it is exercised by TestStaleReadOnTheFlagshipProvokesASecondRefund in
# internal/eval rather than by this file. It is deliberately still not a rule
# here, and the finding from running it is why. Poisoned reconciliation does
# provoke a second full refund, and billing refuses it, because a refund may not
# exceed what the charge still owes. Two requests, one effect, customer whole.
# The run passes.
#
# So this file stays the demonstration of safe recovery, where the agent's own
# care is what produces the outcome. The stale read belongs where its divergence
# is the point: a counterfactual intervention, or the test above, which pins the
# reachability so that collapsing the two reads back into one fails loudly
# instead of quietly retiring the fault.
version: 1
rules:
  - id: billing-temporary-outage
    type: partial_service_outage
    operations: [listCharges, getCharge]
    times: 1
  - id: refund-response-lost
    type: timeout_after_commit
    operations: [createRefund]
    times: 1
