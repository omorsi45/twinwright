name: CI

# The fast lane. Everything here runs on every push and pull request and must
# stay deterministic: no network calls to model providers, no container runtime,
# no wall-clock sleeps. PostgreSQL, container and live-provider work lives in
# integration.yml so a flaky external dependency cannot block a merge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic examples and replay fixtures never call a provider; an
  # accidental key in the environment would make a "passing" run meaningless.
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

jobs:
  build:
    name: format, vet, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: CLI builds and reports a version
        run: |
          go build -o twinwright ./cmd/twinwright
          ./twinwright version

      - name: go test
        run: go test -count=1 ./...

      - name: tidy check
        run: |
          cp go.mod go.mod.orig
          cp go.sum go.sum.orig
          go mod tidy
          diff -u go.mod.orig go.mod
          diff -u go.sum.orig go.sum

  race:
    name: race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The worker runtime is the reason this job exists: lease renewal runs
      # concurrently with execution, and several workers claim from one queue.
      - name: go test -race
        run: go test -race -count=1 ./...

  end-to-end:
    name: deterministic end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Walks the documented pipeline with scripted fixtures: compile, run,
      # evaluate, replay, trace, checkpoint, fork, compare, counterfactual,
      # benchmark smoke, and the distributed enqueue/worker path. This is what
      # keeps the README's commands from drifting away from the binary.
      - name: scripts/e2e.sh
        run: ./scripts/e2e.sh

  security:
    name: secret and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --no-banner --redact --exit-code 1

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
