name: Integration

# The expensive lane: a real PostgreSQL server and a container runtime. Kept
# separate from CI so an infrastructure hiccup here cannot block a merge on
# work it has nothing to do with, and so the fast lane stays fast.
#
# Only the real-model job calls a model, and it calls one served from a local
# Ollama container: no hosted provider is called, and no key is configured in
# this workflow. The hosted-provider live tests (TestLiveOpenAIToolCall and
# TestLiveAnthropicToolCall) are opt-in and run nowhere in CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: postgres ${{ matrix.postgres }} storage and distributed runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Two majors: the storage layer must not depend on a single server
        # version's tolerance for a query.
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: twinwright
          POSTGRES_PASSWORD: twinwright
          POSTGRES_DB: twinwright
        ports:
          - 5432:5432
        # Waiting on pg_isready rather than sleeping is what keeps this job
        # from being the flaky one.
        options: >-
          --health-cmd "pg_isready -U twinwright"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TWINWRIGHT_TEST_POSTGRES_DSN: postgres://twinwright:twinwright@127.0.0.1:5432/twinwright?sslmode=disable
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: migrations, storage parity and runtime
        # The whole suite runs with a DSN present, so every PostgreSQL-gated
        # test participates instead of only the ones someone remembered to list.
        run: go test -count=1 ./...

      - name: distributed runtime under race detection
        # Fencing and takeover are concurrency properties; PostgreSQL is where
        # workers hold genuinely parallel connections.
        run: go test -race -count=1 ./internal/worker/ ./internal/store/

      - name: end-to-end against postgres
        run: ./scripts/e2e.sh "$TWINWRIGHT_TEST_POSTGRES_DSN"

  docker:
    name: container sidecars against a real daemon
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This job exists so the container executor's claims are backed by a daemon
    # rather than by a fake. The unit tests assert the argv the executor builds;
    # only a real daemon proves docker accepts that argv, that the health gate
    # means the published port is serving, and that a failed start leaves no
    # container behind.
    env:
      TWINWRIGHT_TEST_DOCKER: "1"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: daemon is available
        run: docker version --format '{{.Server.Version}}'

      - name: pull the images the tests use
        # Pulling up front keeps an image download out of a startup_timeout
        # budget, which would otherwise look like an unhealthy container.
        run: |
          docker pull hashicorp/http-echo:1.0
          docker pull busybox:1.36

      - name: container integration tests
        run: go test -count=1 -v -run 'Docker' ./internal/container/

      - name: the shipped example config starts and stops through the CLI
        run: |
          go build -o twinwright ./cmd/twinwright
          ./twinwright container start --config examples/container/http-echo.yaml
          ./twinwright container status --config examples/container/http-echo.yaml
          ./twinwright container stop --config examples/container/http-echo.yaml

  real-model:
    name: a real small model on a local Ollama server, recorded and replayed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Every other test answers the provider adapters from a script or a recording.
    # This job is the one place a model nobody wrote for the test makes the
    # decisions, and it proves two things about it: that a run against a real
    # server can be recorded, and that the recording reconstructs the run with the
    # server stopped. It does not gate on the model getting the scenario right: the
    # evaluation verdict is reported, because a small model failing a scenario is a
    # result and not a broken build. It does fail when the run cannot be recorded,
    # does not complete, or does not replay.
    #
    # The model runs on CPU, so the first call includes loading it and the script
    # gives each provider attempt 300 seconds instead of the CLI's 90.
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      TW_LIVE_MODEL: qwen2.5:1.5b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: choose where the run's files go
        # The runner context is not available in a job-level env, so the
        # directory is exported from a step. It is outside the checkout, so
        # nothing the script writes can be committed from here.
        run: echo "TW_LIVE_OUT=$RUNNER_TEMP/live" >> "$GITHUB_ENV"

      - name: start ollama
        # A pinned tag, not latest: the server version is part of what the report
        # describes.
        run: docker run -d --name ollama -p 11434:11434 ollama/ollama:0.40.11

      - name: wait for the server
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs ollama
          echo "ollama did not answer on 127.0.0.1:11434" >&2
          exit 1

      - name: pull the model
        # Pulling up front keeps the download out of the first call's deadline. A
        # failed pull is tried again twice before the job fails.
        run: |
          for attempt in 1 2 3; do
            if docker exec ollama ollama pull "$TW_LIVE_MODEL"; then
              exit 0
            fi
            echo "pull attempt $attempt failed" >&2
            sleep 10
          done
          exit 1

      - name: record a run with the model and replay it from the ledger and the cassette
        run: ./scripts/live-model.sh

      - name: stop the server and replay from the cassette alone
        # The script already replayed from the cassette while the server was up.
        # This replay runs after the container is stopped and the port is shown to
        # be closed, so a verdict here cannot have come from the server.
        run: |
          set -euo pipefail
          docker stop ollama
          if curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
            echo "the server still answers after docker stop" >&2
            exit 1
          fi
          run_id="$(jq -r .run_id "$TW_LIVE_OUT/live-model-report.json")"
          env -u OPENAI_API_KEY -u OPENAI_BASE_URL "$TW_LIVE_OUT/twinwright" replay "$run_id" \
            --manifest "$TW_LIVE_OUT/billing.manifest.json" --db "$TW_LIVE_OUT/live.db" \
            --cassette "$TW_LIVE_OUT/live.cassette.jsonl" | tee "$TW_LIVE_OUT/replay-server-stopped.json"
          jq -e '.verified == true' "$TW_LIVE_OUT/replay-server-stopped.json"
          # The digest is what ties the report to specific weights, so a report
          # without one is not a report this job accepts.
          jq -e '.model_digest | length > 0' "$TW_LIVE_OUT/live-model-report.json"

      - name: show the report
        if: always()
        run: |
          if [ -f "$TW_LIVE_OUT/live-model-report.json" ]; then
            jq . "$TW_LIVE_OUT/live-model-report.json"
          else
            echo "the script wrote no report" >&2
          fi

      - name: server log
        if: failure()
        run: docker logs --tail 100 ollama

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-model-run
          path: |
            ${{ runner.temp }}/live/live-model-report.json
            ${{ runner.temp }}/live/live.cassette.jsonl
          if-no-files-found: warn
          retention-days: 30

