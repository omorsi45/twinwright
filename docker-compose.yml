# Local services for developing against the distributed runtime.
#
# Neither service is required: Twinwright's default backend is SQLite and its
# traces print to stdout. Bring these up when you want to exercise the
# PostgreSQL path or send OTLP spans somewhere that renders them.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: twinwright
      POSTGRES_PASSWORD: twinwright
      POSTGRES_DB: twinwright
    ports:
      # 5432 on the host, so the DSN in the Makefile and README works as
      # written. Change the host side if you already run PostgreSQL locally.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twinwright"]
      interval: 5s
      timeout: 5s
      retries: 20
    # A development database: tuned for a fast restart, not for durability.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      # OTLP/HTTP, which is what `twinwright trace --format otlp` produces and
      # what `--otlp-endpoint` posts to.
      - "127.0.0.1:4318:4318"
