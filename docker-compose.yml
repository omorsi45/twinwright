# Local services for developing against the distributed runtime.
#
# None of these services is required: Twinwright's default backend is SQLite and
# its traces print to stdout, and the default test suite starts none of them.
# Bring them up when you want to exercise the PostgreSQL path, send OTLP spans
# somewhere that renders them, or scrape a worker.
#
#   postgres        the PostgreSQL path (127.0.0.1:5432)
#   otel-collector  receives OTLP/HTTP (127.0.0.1:4318), prints what it gets and
#                   forwards it to jaeger; health check on 127.0.0.1:13133
#   jaeger          stores the spans; UI and query API on 127.0.0.1:16686
#   prometheus      scrapes workers started on the host with
#                   --metrics-addr 0.0.0.0:9095 and 0.0.0.0:9096; UI and query
#                   API on 127.0.0.1:9090
#
# `docker compose up -d` starts all four. Name services to start fewer, for
# example `docker compose up -d postgres`.
#
# There is no TLS and no authentication on any of them. Every published port is
# bound to loopback so they are not reachable from other machines.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: twinwright
      POSTGRES_PASSWORD: twinwright
      POSTGRES_DB: twinwright
    ports:
      # 5432 on the host, so the DSN in the Makefile and README works as
      # written. Change the host side if you already run PostgreSQL locally.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twinwright"]
      interval: 5s
      timeout: 5s
      retries: 20
    # A development database: tuned for a fast restart, not for durability.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - jaeger
    ports:
      # OTLP/HTTP, which is what `twinwright trace --format otlp` produces and
      # what `--otlp-endpoint` posts to.
      - "127.0.0.1:4318:4318"
      # The health_check extension, which answers 200 once the collector runs.
      - "127.0.0.1:13133:13133"

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      # The UI and the query API (GET /api/traces/{traceID}). Jaeger's OTLP
      # receiver on 4317 is not published: only the collector reaches it, over
      # the Compose network.
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # The scrape target is a worker running on the host. On Linux the name does
    # not exist inside a container unless it is mapped, and host-gateway maps it
    # to the host's address on the bridge, so the worker has to listen on that
    # address (0.0.0.0, or the bridge address) and not on loopback alone.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
